# Paper Reading（HTTPS 已启用）。由 apply-nginx.sh 在证书存在时选用；__PAPER_DOMAIN__ / __TELEAGENT_DOMAIN__ / __PAPER_HTTPS_PORT__ 会被替换。
# 容器内监听 443；宿主机同时发布 443 和 8443（未备案域名在 443 会被腾讯云拦截，对外用 8443）。
# 80 端口：ACME 验证、健康检查，其余跳转到 HTTPS
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /srv/acme; }
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 301 https://__PAPER_DOMAIN__:__PAPER_HTTPS_PORT__$request_uri; }
}
# teleagent 域名的 80 端口：跳到 TeleAgent 自己的 HTTPS（9443）
server {
    listen 80;
    server_name __TELEAGENT_DOMAIN__;
    location /.well-known/acme-challenge/ { root /srv/acme; }
    location / { return 301 https://__TELEAGENT_DOMAIN__:9443$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name __PAPER_DOMAIN__;
    ssl_certificate     /etc/nginx/ssl/__PAPER_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/__PAPER_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /srv/paper;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
}
